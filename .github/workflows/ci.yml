name: GLRChain API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: glrchain-api-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: glrchain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glrchain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/glrchain
      SECRET_KEY: ci-only-glrchain-key-not-for-deployment-001122334455
      LOG_LEVEL: WARNING

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Apply migrations against PostGIS/PostgreSQL
        run: alembic upgrade head

      - name: Run API security and persistence tests
        run: python -m pytest -q

      - name: Build API container
        run: docker build --tag glrchain-backend:ci .
