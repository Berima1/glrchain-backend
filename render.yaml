services:
  - type: web
    name: glrchain-backend
    env: python
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REPORT_ENCRYPTION_KEY
        sync: false
      - key: GLRCHAIN_EVIDENCE_BUCKET
        sync: false
